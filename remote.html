<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0B0D">
<title>Elev8 · שלט מרחוק</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0D; --panel:#14161A; --panel2:#1C1F25; --line:#2A2E36;
    --text:#F2EFE9; --dim:#8B909B; --onair:#FF4438; --glass:#7FD1C8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:'Heebo',system-ui,sans-serif;overflow:hidden;display:flex;flex-direction:column}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);flex-shrink:0;gap:8px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--glass);box-shadow:0 0 12px var(--glass)}
  .brand h1{font-size:15px;font-weight:900;letter-spacing:.5px}
  .brand span{color:var(--dim);font-weight:300;font-size:12px}

  #syncBadge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;color:var(--dim);font-weight:500;
    padding:4px 9px;border-radius:20px;
    background:var(--panel2);border:1px solid var(--line);user-select:none;
  }
  #syncBadge .sdot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  #syncBadge.ok .sdot{background:var(--glass)}
  #syncBadge.ok{color:var(--glass);border-color:rgba(127,209,200,.35)}
  #syncBadge.busy .sdot{background:#e0b84a;animation:spulse 1s infinite}
  #syncBadge.busy{color:#e0b84a;border-color:rgba(224,184,74,.35)}
  #syncBadge.err .sdot{background:var(--onair)}
  #syncBadge.err{color:var(--onair);border-color:rgba(255,68,56,.35)}
  @keyframes spulse{0%,100%{opacity:1}50%{opacity:.35}}

  main{flex:1;overflow-y:auto;padding:14px 14px 24px 14px;display:flex;flex-direction:column;gap:12px}

  .sectionTitle{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:.5px;padding:0 2px}

  .scriptPicker{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px}
  .pickerRow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid transparent;font-size:14px;cursor:pointer;transition:border-color .1s}
  .pickerRow + .pickerRow{margin-top:6px}
  .pickerRow.sel{border-color:var(--onair)}
  .pickerRow .pname{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pickerRow .pactive{font-size:10px;font-weight:700;color:var(--onair);border:1px solid var(--onair);border-radius:6px;padding:1px 7px}

  textarea{
    width:100%;min-height:200px;resize:vertical;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;color:var(--text);
    font-family:inherit;font-size:15px;line-height:1.7;padding:14px;outline:none;
  }
  textarea:focus{border-color:var(--glass)}
  input[type=text]{
    width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:14px;padding:10px 12px;outline:none;direction:rtl;text-align:right;
  }
  input[type=text]:focus{border-color:var(--glass)}

  .controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .cbtn{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 8px;font-size:14px;font-weight:600;color:var(--text);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    min-height:72px;transition:transform .1s,background .1s;user-select:none;
  }
  .cbtn:active{background:var(--panel2);transform:scale(.97)}
  .cbtn .em{font-size:22px;line-height:1}
  .cbtn .lb{font-size:12px;color:var(--dim);font-weight:500}
  .cbtn.play{
    grid-column:1 / -1;background:var(--onair);border-color:var(--onair);
    color:#fff;font-weight:900;font-size:20px;min-height:88px;
  }
  .cbtn.play .lb{color:rgba(255,255,255,.8)}
  .cbtn.play.paused{background:var(--panel);border-color:var(--glass);color:var(--glass)}
  .cbtn.play.paused .lb{color:var(--dim)}
  .cbtn.danger{border-color:rgba(255,68,56,.4);color:var(--onair)}
  .cbtn.chapter{border-color:rgba(127,209,200,.4);color:var(--glass)}
  .cbtn.chapter .lb{color:rgba(127,209,200,.7)}

  .status{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:10px 14px;display:flex;justify-content:space-between;font-size:13px;color:var(--dim);gap:12px;flex-wrap:wrap;
  }
  .status b{color:var(--text);font-weight:700}
  .status .pill{display:inline-flex;align-items:center;gap:6px}
  .status .pill .d{width:8px;height:8px;border-radius:50%;background:var(--dim)}
  .status .pill.on .d{background:var(--onair);box-shadow:0 0 8px var(--onair)}

  .hint{background:var(--panel);border-right:3px solid var(--glass);border-radius:10px;padding:11px 14px;font-size:12px;color:var(--dim);line-height:1.6}
  .hint b{color:var(--text)}

  .navback{display:flex;justify-content:flex-end}
  .navback a{color:var(--dim);font-size:12px;text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>

<header>
  <div class="brand"><div class="dot"></div><h1>ELEV8 <span>· שלט מרחוק</span></h1></div>
  <span id="syncBadge"><span class="sdot"></span><span id="syncText">מתחיל...</span></span>
</header>

<main>
  <div class="status">
    <div class="pill" id="statusPlaying"><div class="d"></div><span>עצור</span></div>
    <div>מהירות <b id="statusSpeed">–</b></div>
    <div>פונט <b id="statusFont">–</b></div>
  </div>

  <div class="controls">
    <button class="cbtn play" id="btnPlay" data-cmd="play">
      <span class="em">▶</span><span>התחל / עצור</span>
      <span class="lb" id="btnPlayLb">Play/Pause</span>
    </button>

    <button class="cbtn chapter" data-cmd="chapterPrev"><span class="em">⏮</span>פרק<span class="lb">קודם</span></button>
    <button class="cbtn" data-cmd="restart"><span class="em">⟲</span>התחלה<span class="lb">Restart</span></button>
    <button class="cbtn chapter" data-cmd="chapterNext"><span class="em">⏭</span>פרק<span class="lb">הבא</span></button>

    <button class="cbtn" data-cmd="slower"><span class="em">🐢</span>מהירות <span class="lb">−</span></button>
    <button class="cbtn" data-cmd="fontDown"><span class="em">A−</span>פונט<span class="lb">קטן</span></button>
    <button class="cbtn" data-cmd="faster"><span class="em">🐇</span>מהירות <span class="lb">+</span></button>

    <button class="cbtn" data-cmd="jumpBack"><span class="em">⏪</span>קפיצה<span class="lb">אחורה</span></button>
    <button class="cbtn" data-cmd="fontUp"><span class="em">A+</span>פונט<span class="lb">גדול</span></button>
    <button class="cbtn" data-cmd="jumpFwd"><span class="em">⏩</span>קפיצה<span class="lb">קדימה</span></button>

    <button class="cbtn danger" data-cmd="exit" style="grid-column:1"><span class="em">✕</span>יציאה<span class="lb">Exit</span></button>
    <button class="cbtn" data-cmd="start" style="grid-column:3"><span class="em">🎬</span>הפעל<span class="lb">מסך פרומפטר</span></button>
  </div>

  <div class="sectionTitle">בחר סקריפט</div>
  <div class="scriptPicker" id="scriptPicker"></div>

  <div class="sectionTitle">עריכה</div>
  <input type="text" id="editName" placeholder="שם הסקריפט">
  <textarea id="editText" placeholder="טוען..."></textarea>

  <div class="hint"><b>שים לב:</b> הפעולות "התחל", "מהירות", "קפיצה" וכו' עובדות רק כשמסך הפרומפטר פתוח במכשיר הראשי. שינויי טקסט מסתנכרנים תוך שנייה.<br><br><b>פרקים:</b> עטוף כל חלק ב-<code>**</code> בשורה נפרדת בהתחלה ובסוף — כפתורי "פרק הבא/קודם" יקפצו ביניהם.</div>

  <div class="navback"><a href="/">← חזרה למסך הראשי</a></div>
</main>

<script>
const SYNC_URL='/api/sync', CMD_URL='/api/cmd';
const badge=document.getElementById('syncBadge'), badgeText=document.getElementById('syncText');
function setSync(state,text){badge.classList.remove('ok','busy','err'); if(state)badge.classList.add(state); badgeText.textContent=text;}
setSync('busy','טוען...');

let doc = { scripts:[], settings:null, keymap:null, tombstones:[] };
let curId = localStorage.getItem('elev8remote_cur') || null;
let statePlay = false;

function findScript(id){ return doc.scripts.find(s=>s.id===id); }
function activeScript(){ return findScript(curId) || doc.scripts[0]; }

async function pullSync(){
  try{
    const res=await fetch(SYNC_URL,{cache:'no-store'});
    if(!res.ok)throw 0;
    const remote=await res.json();
    doc = remote;
    if (!curId && doc.scripts.length) curId = doc.scripts[0].id;
    if (curId && !findScript(curId) && doc.scripts.length) curId = doc.scripts[0].id;
    renderPicker(); renderEdit(); renderStatus();
    setSync('ok','מסונכרן');
  }catch(e){setSync('err','אין חיבור');}
}

function renderPicker(){
  const el=document.getElementById('scriptPicker');
  el.innerHTML='';
  if (!doc.scripts.length){ el.innerHTML='<div style="color:var(--dim);padding:12px;text-align:center;font-size:13px">אין סקריפטים</div>'; return; }
  doc.scripts.forEach(s=>{
    const row=document.createElement('div');
    row.className='pickerRow'+(s.id===curId?' sel':'');
    const words = s.text.trim()? s.text.trim().split(/\s+/).length : 0;
    row.innerHTML=`<div class="pname">${escapeHtml(s.name)}</div>
      <div style="color:var(--dim);font-size:11px">${words} מילים</div>
      ${s.id===curId?'<span class="pactive">נבחר</span>':''}`;
    row.onclick=()=>{ curId=s.id; localStorage.setItem('elev8remote_cur',curId); renderPicker(); renderEdit(); };
    el.appendChild(row);
  });
}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function renderStatus(){
  const st = doc.settings || {};
  document.getElementById('statusSpeed').textContent = st.speed ?? '–';
  document.getElementById('statusFont').textContent = st.font ?? '–';
}

let editingText = false, editingName = false;
const editText=document.getElementById('editText'), editName=document.getElementById('editName');
editText.addEventListener('focus',()=>editingText=true);
editText.addEventListener('blur', ()=>{editingText=false; setTimeout(pullSync,300);});
editName.addEventListener('focus',()=>editingName=true);
editName.addEventListener('blur', ()=>{editingName=false; setTimeout(pullSync,300);});

function renderEdit(){
  const s = activeScript();
  if (!s){ editText.value=''; editName.value=''; return; }
  if (!editingText) editText.value = s.text;
  if (!editingName) editName.value = s.name;
}

/* --- push edits with debounce --- */
let pushTimer=null;
function scheduleSyncPush(){
  clearTimeout(pushTimer);
  pushTimer=setTimeout(pushSync, 800);
}
async function pushSync(){
  const s = activeScript(); if (!s) return;
  s.text = editText.value; s.name = editName.value.trim() || s.name;
  s.updatedAt = Date.now();
  const outgoing = {
    updatedAt: Date.now(),
    scripts: doc.scripts.map(x=>({id:x.id,name:x.name,text:x.text,updatedAt:x.updatedAt||0})),
    settings: doc.settings, keymap: doc.keymap,
    tombstones: doc.tombstones || [],
  };
  setSync('busy','מסנכרן...');
  try{
    const res=await fetch(SYNC_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(outgoing),cache:'no-store'});
    if(!res.ok)throw 0;
    const merged=await res.json();
    doc=merged;
    renderPicker(); renderStatus();
    setSync('ok','מסונכרן');
  }catch(e){setSync('err','אין חיבור');}
}
editText.addEventListener('input', scheduleSyncPush);
editName.addEventListener('input', scheduleSyncPush);

/* --- send commands --- */
async function sendCmd(cmd, payload){
  try{
    await fetch(CMD_URL,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({cmd,payload:payload||null}),cache:'no-store'});
    if (cmd==='play') { statePlay = !statePlay; renderPlayBtn(); }
  }catch(e){}
}
function renderPlayBtn(){
  const b=document.getElementById('btnPlay');
  const p=document.getElementById('statusPlaying');
  b.querySelector('.em').textContent = statePlay ? '❚❚' : '▶';
  b.classList.toggle('paused', statePlay);
  p.classList.toggle('on', statePlay);
  p.querySelector('span').textContent = statePlay ? 'משדר' : 'עצור';
}
document.querySelectorAll('[data-cmd]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const cmd = b.dataset.cmd;
    if (cmd==='start') sendCmd('start', {scriptId: curId});
    else sendCmd(cmd, {scriptId: curId});
    // haptic
    try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
  });
});

/* --- polling --- */
pullSync();
setInterval(pullSync, 3000);
window.addEventListener('online',  ()=>{setSync('busy','מסנכרן...'); pullSync();});
window.addEventListener('offline', ()=>setSync('err','אין חיבור'));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pullSync(); });
</script>
</body>
</html>
